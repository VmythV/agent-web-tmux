[package]
name = "agent-web-tmux"
version = "0.2.0"
edition = "2024"
description = "Local web control of interactive coding agents through tmux"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.28"

[profile.release]
strip = true
